# GitVersion configuration for Wintangle
#
# Versioning scheme: Mainline (v6: Mainline version strategy + ContinuousDeployment
# on main, the documented replacement for the removed `mode: Mainline`)
#   main       -> stable releases (1.0.8, 1.0.9, ...) — every commit bumps Patch
#   develop    -> pre-release  1.0.8-alpha.1, 1.0.8-alpha.2, ...
#   feature/*  -> pre-release  1.0.8-feature-<name>.1, ...
#   fix/*      -> pre-release  1.0.8-fix-<name>.1, ...
#   hotfix/*   -> pre-release  1.0.8-hotfix.1, ... (pre-release of the next
#                  release; branch is cut from the v1.0.7 tag / main)
#   tags vX.Y.Z -> exact release version (drives .github/workflows/release.yml)
#
# Why Mainline: every commit on main must produce a unique stable version.
# ContinuousDelivery would pin main at 1.0.7 until the next tag; Mainline is
# the documented fit for GitHub-Flow + pre-release develop scheme.
#
# No `next-version` on purpose: tag v1.0.7 sits on main HEAD, so the current
# commit derives 1.0.7 and the NEXT main commit becomes 1.0.8. Add
# `next-version: 1.0.8` only if version tags are ever lost.
#
# v6 notes:
# - `increment` is explicit (Patch) on every branch, NOT `Inherit`: with the
#   Mainline strategy, Inherit on a non-main branch double-increments (the
#   stable tag at the branch base already consumed the Patch bump).
# - `{BranchName}` needs the (?<BranchName>.+) named group in the regex; v6
#   removed the `useBranchName` magic value.
mode: ContinuousDelivery

strategies:
  - Mainline

tag-prefix: '[vV]'

# AssemblyVersion/FileVersion: 1.0.8.0-style (default MajorMinorPatch).
# InformationalVersion (what UpdateService reads): 6.x default format
# e.g. "1.0.8-alpha.1+Branch.develop.Sha.<sha>" — parses fine in
# ReleaseVersion.TryParse (strips -prerelease and +metadata suffixes).
assembly-versioning-scheme: MajorMinorPatch
assembly-file-versioning-scheme: MajorMinorPatch

branches:
  main:
    regex: ^main$
    mode: ContinuousDeployment
    label: ''
    increment: Patch

  develop:
    regex: ^develop$
    label: alpha
    increment: Patch

  feature:
    regex: ^features?[/-](?<BranchName>.+)
    label: feature-{BranchName}
    increment: Patch

  fix:
    regex: ^fix(es)?[/-](?<BranchName>.+)
    label: fix-{BranchName}
    increment: Patch

  hotfix:
    regex: ^hotfix(es)?[/-]
    label: hotfix
    increment: Patch

  pull-request:
    regex: ^(pull|pull-requests|pr)[/-]
    label: PullRequest
    increment: Patch
