name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'hotfix/**']
  pull_request:

jobs:
  # Core tests are OS-independent (geometry, hotkeys, config) — run on Linux.
  test-core:
    runs-on: ubuntu-latest
    steps:
      # GitVersion needs full history + tags; a shallow checkout (default) fails.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # NOTE: setup-dotnet's `cache: true` requires a packages.lock.json in
      # the workspace root and hard-fails when it is absent. This repo has no
      # lock file and only a handful of test packages, so caching is omitted.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test Wintangle.Core
        run: dotnet test tests/Wintangle.Core.Tests -c Release

  # WPF + net8.0-windows builds natively on windows-latest.
  # (EnableWindowsTargeting is already set in the csproj; harmless here.)
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Compute the GitVersion semver once, from the same config GitVersion.MsBuild
      # uses during build, so the artifact name matches the baked-in version.
      # (GitVersion 6 prints pretty multi-line JSON — pwsh joins the pipeline
      # before ConvertFrom-Json parses it.)
      - name: Compute version
        shell: pwsh
        run: |
          dotnet tool restore
          $gv = dotnet dotnet-gitversion /output json | ConvertFrom-Json
          Write-Host "Version: $($gv.SemVer)"
          "GV_SEMVER=$($gv.SemVer)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build solution
        run: dotnet build Wintangle.sln -c Release

      - name: Publish self-contained
        run: dotnet publish src/Wintangle.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o artifacts/publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wintangle-${{ env.GV_SEMVER }}-win-x64
          path: artifacts/publish
