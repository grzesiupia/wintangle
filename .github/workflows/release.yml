name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      # GitVersion needs full history + tags; a shallow checkout (default) fails.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # GitVersion.MsBuild (via Directory.Build.props) sets Version, FileVersion,
      # AssemblyVersion and InformationalVersion from the tag: v1.0.8 -> 1.0.8.
      - name: Publish self-contained
        run: dotnet publish src/Wintangle.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o artifacts/publish

      # Chocolatey package "innosetup" installs the official Inno Setup 6 under
      # "C:\Program Files (x86)\Inno Setup 6".
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # ISCC is referenced by full path rather than relying on PATH, which the
      # runner process does not refresh after the choco install above.
      # /DAppVersion comes from the tag name (v1.0.8 -> 1.0.8), which always
      # matches the GitVersion-computed version baked into the assembly.
      - name: Build installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "build\setup.iss" "/DAppVersion=$version"

      # The raw self-contained exe is intentionally NOT staged: releases carry
      # only the installer (single-file binary is embedded in the setup).
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/Output/wintangle-setup.exe" \
            --title "wintangle $GITHUB_REF_NAME" \
            --generate-notes
